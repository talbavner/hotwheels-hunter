name: debug-fetch
on: workflow_dispatch
permissions: { contents: read }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="hw-hunter-updater (+https://github.com/talbavner/hotwheels-hunter)"
          curl -sL -A "$UA" https://hwpriceguide.com/category/super-treasure-hunt/ -o out/cat.html
          for s in $(grep -oE '/item/[a-z0-9-]+' out/cat.html | sort -u | grep 2026 | head -2) /item/2024-mainline-70-dodge-charger; do
            curl -sL -A "$UA" "https://hwpriceguide.com$s" -o "out/$(basename $s).html"; sleep 2; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: out }
